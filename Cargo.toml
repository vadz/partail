[package]
name = "partail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Follow several log files in parallel, with regex-based colouring"
readme = "README.md"
keywords = ["tail", "log", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
